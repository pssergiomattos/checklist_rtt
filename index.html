    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100dvh;
            margin: 0;
            padding: 4vh 15px 20px 15px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            min-height: 50px;
        }
        .logo {
            max-width: 120px;
            max-height: 80px;
            object-fit: contain;
            border-radius: 8px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 20px;
        }
        p.subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        
        .info-group {
            margin-bottom: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        label.input-label {
            font-size: 13px;
            color: #555;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        select, input[type="text"], input[type="tel"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: white;
            font-family: inherit;
        }
        select:focus, input[type="text"]:focus, input[type="tel"]:focus, textarea:focus {
            outline: none;
            border-color: #8b0000;
            box-shadow: 0 0 5px rgba(139, 0, 0, 0.4);
        }
        input[type="text"]:last-child, input[type="tel"]:last-child, textarea:last-child {
            margin-bottom: 0;
        }
        textarea {
            resize: vertical;
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .checklist-main-title {
            font-size: 16px;
            color: #333;
            border-bottom: 2px solid #8b0000;
            padding-bottom: 5px;
            margin-bottom: 5px;
            margin-top: 5px;
            font-weight: bold;
        }
        .section-header {
            font-size: 12px;
            color: #fff;
            background-color: #343a40;
            padding: 6px 10px;
            border-radius: 4px;
            margin-top: 10px;
            margin-bottom: 0px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        .check-item-container {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }
        .check-item-container:last-child {
            border-bottom: none;
        }
        .check-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .check-item-name {
            font-size: 13.5px;
            color: #333;
            font-weight: 500;
            flex-grow: 1;
            padding-right: 8px;
            line-height: 1.2;
        }

        .toggle-group {
            display: flex;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .toggle-group input[type="radio"] { display: none; }
        .toggle-group label {
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: 0.2s;
            margin: 0;
            border-right: 1px solid #dee2e6;
            text-align: center;
        }
        .toggle-group label:last-child { border-right: none; }
        .toggle-group.dual label { min-width: 45px; }
        .toggle-group.triple label { min-width: 35px; }
        .toggle-group input[value="OK"]:checked + label { background-color: #28a745; color: white; }
        .toggle-group input[value="Não OK"]:checked + label { background-color: #dc3545; color: white; }
        .toggle-group input[value="N/A"]:checked + label { background-color: #6c757d; color: white; }

        .photo-section {
            margin-top: 10px;
            display: none; 
            align-items: center;
            flex-wrap: wrap; 
            gap: 8px;
            padding-top: 8px;
            border-top: 1px dashed #e9ecef;
        }
        
        .btn-camera {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }
        .btn-camera:active { background-color: #e2e6ea; }
        
        .photo-thumb {
            width: 48px;
            height: 36px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ccc;
            display: none;
        }

        .action-buttons {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-enviar-texto {
            width: 100%;
            padding: 14px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-enviar-texto:active { background-color: #1ebe57; }
        
        .btn-enviar-fotos {
            width: 100%;
            padding: 14px;
            background-color: #128C7E;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
        }
        .btn-enviar-fotos:active { background-color: #0c6b5f; }

        .ajuda-envio {
            text-align: center;
            font-size: 11px;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }

        .area-servico { display: none; }
    </style>
</head>

            <label class="input-label">Número da OM:</label>

    window.toggleFotoBotao = function(index) {

    function renderizarChecklist(estruturaArray, containerId) {
        let htmlChecklist = '';
        
        estruturaArray.forEach(linha => {
            if (linha.tipo === 'titulo') {
                htmlChecklist += `<div class="section-header">${linha.nome}</div>`;
            } else {
                let nomeItem = linha.nome;
                
                let hasNA = (nomeItem === "NÃO CONFORMIDADES" || nomeItem === "OUTROS"); 
                
                let defaultNaoOk = !hasNA ? "checked" : "";
                let defaultNA = hasNA ? "checked" : ""; 
                let classeToggle = hasNA ? "triple" : "dual";

                let botoesHtml = `
                    <input type="radio" id="item${itemIndex}-ok" name="item${itemIndex}" value="OK" onchange="toggleFotoBotao(${itemIndex})">
                    <label for="item${itemIndex}-ok">OK</label>
                    
                    <input type="radio" id="item${itemIndex}-nao" name="item${itemIndex}" value="Não OK" ${defaultNaoOk} onchange="toggleFotoBotao(${itemIndex})">
                    <label for="item${itemIndex}-nao">Não OK</label>
                `;

                if (hasNA) {
                    botoesHtml += `
                        <input type="radio" id="item${itemIndex}-na" name="item${itemIndex}" value="N/A" ${defaultNA} onchange="toggleFotoBotao(${itemIndex})">
                        <label for="item${itemIndex}-na">N/A</label>

    function processarFoto(event, index, nomeDaEtapa) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_DIMENSION = 1200; 
                let drawW = img.width;
                let drawH = img.height;

                if (drawW > MAX_DIMENSION || drawH > MAX_DIMENSION) {
                    if (drawW > drawH) {
                        drawH = Math.round((drawH * MAX_DIMENSION) / drawW);
                        drawW = MAX_DIMENSION;
                    } else {
                        drawW = Math.round((drawW * MAX_DIMENSION) / drawH);
                        drawH = MAX_DIMENSION;
                    }
                }

                canvas.width = drawW;
                canvas.height = drawH;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(img, 0, 0, drawW, drawH);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                const thumb = document.getElementById(`thumb-${index}`);
                thumb.src = dataUrl;
                thumb.style.display = 'block';

                canvas.toBlob(function(blob) {
                    const prefixoOrdem = String(index).padStart(2, '0');
                    const nomeLindo = prefixoOrdem + '_' + nomeDaEtapa.replace(/[^a-zA-Z0-9]/g, '_') + '.jpg';
                    const arquivoFinal = new File([blob], nomeLindo, { type: 'image/jpeg' });
                    
                    bancoDeFotos[index] = arquivoFinal;
                }, 'image/jpeg', 0.8); 
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function gerarTextoRelatorio() {
        const selecao = document.getElementById('tipo-servico');
        const nomeServico = selecao.options[selecao.selectedIndex].text;
        
        const objData = new Date();
        const dia = String(objData.getDate()).padStart(2, '0');
        const mes = String(objData.getMonth() + 1).padStart(2, '0');
        const ano = objData.getFullYear();
        const dataFormatada = `${dia}/${mes}/${ano}`;
        
        let textoMsg = "*RELATÓRIO DE PRÉ-OPERAÇÃO*\n";
        textoMsg += "*Serviço:* " + nomeServico + "\n";
        textoMsg += "*Data:* " + dataFormatada + "\n\n";

        const checkIcon = String.fromCodePoint(0x2705);
        const crossIcon = String.fromCodePoint(0x274C);
        const minusIcon = String.fromCodePoint(0x2796);

        let containerChecklistId = '';
        let obsTexto = '';

        if (selecao.value === 'revestimento') {
            const tec = document.getElementById('rev-tecnico').value.trim() || "Não informado";
            const om = document.getElementById('rev-om').value.trim() || "Não informada";
            const idTambor = document.getElementById('rev-id-tambor').value.trim() || "Não informado";
            
            textoMsg += "*Técnico:* " + tec + "\n";
            textoMsg += "*OM:* " + om + "\n";
            textoMsg += "*Identificação Tambor:* " + idTambor + "\n\n";
            
            containerChecklistId = 'checklist-revestimento';
            obsTexto = document.getElementById('rev-observacoes').value.trim();
        } 
        else if (selecao.value === 'emenda-lona-quente') {
            const tec = document.getElementById('eq-tecnico').value.trim() || "Não informado";
            const om = document.getElementById('eq-om').value.trim() || "Não informada";
            const idEmenda = document.getElementById('eq-id-emenda').value.trim() || "Não informado";
            
            textoMsg += "*Técnico:* " + tec + "\n";
            textoMsg += "*OM:* " + om + "\n";
            textoMsg += "*Identificação da Emenda:* " + idEmenda + "\n\n";
            
            containerChecklistId = 'checklist-emenda-quente';
            obsTexto = document.getElementById('eq-observacoes').value.trim();
        }
        else if (selecao.value === 'emenda-lona-frio') {
            const tec = document.getElementById('ef-tecnico').value.trim() || "Não informado";
            const om = document.getElementById('ef-om').value.trim() || "Não informada";
            const idEmenda = document.getElementById('ef-id-emenda').value.trim() || "Não informado";
            
            textoMsg += "*Técnico:* " + tec + "\n";
            textoMsg += "*OM:* " + om + "\n";
            textoMsg += "*Identificação da Emenda:* " + idEmenda + "\n\n";
            
            containerChecklistId = 'checklist-emenda-frio';
            obsTexto = document.getElementById('ef-observacoes').value.trim();
        }
        else if (selecao.value === 'emenda-cabo') {
            const tec = document.getElementById('ec-tecnico').value.trim() || "Não informado";
            const om = document.getElementById('ec-om').value.trim() || "Não informada";
            const idEmenda = document.getElementById('ec-id-emenda').value.trim() || "Não informado";
            
            textoMsg += "*Técnico:* " + tec + "\n";
            textoMsg += "*OM:* " + om + "\n";
            textoMsg += "*Identificação da Emenda:* " + idEmenda + "\n\n";
            
            containerChecklistId = 'checklist-emenda-cabo';
            obsTexto = document.getElementById('ec-observacoes').value.trim();
        }

        textoMsg += "*CHECKLIST FOTOGRÁFICO:*\n";
        
        const elementosChecklist = document.getElementById(containerChecklistId).children;
        
        Array.from(elementosChecklist).forEach(el => {
            if (el.classList.contains('section-header')) {
                textoMsg += "\n*" + el.innerText + "*\n";
            } else if (el.classList.contains('check-item-wrapper')) {
                const nomeFoto = el.getAttribute('data-nome');
                const radioSelecionado = el.querySelector('input[type="radio"]:checked');
                const status = radioSelecionado ? radioSelecionado.value : "Não OK";
                
                let icone = crossIcon; 
                let textoFinal = status;

                if (status === 'OK') {
                    icone = checkIcon; 
                } else if (status === 'N/A') {
                    icone = minusIcon; 
                    textoFinal = 'Não Aplicável';
                }
                
                textoMsg += icone + " " + nomeFoto + ": " + textoFinal + "\n";
            }
        });

        if (obsTexto !== "") {
            textoMsg += `\n*OBSERVAÇÕES:*\n${obsTexto}\n`;
        }
        
        return textoMsg;
    }

    function enviarTextoWhatsApp() {
        const textoMsg = gerarTextoRelatorio();

        params.append('text', textoMsg);
        window.open('https://api.whatsapp.com/send?' + params.toString(), '_blank');
    }

    async function enviarFotosWhatsApp() {
        const filesArray = [];
        for (let i = 0; i < itemIndex; i++) {
            const radioOk = document.getElementById('item' + i + '-ok');
            if (radioOk && radioOk.checked && bancoDeFotos[i]) {
                filesArray.push(bancoDeFotos[i]);
            }
        }

        if (filesArray.length === 0) {
            alert("Nenhuma foto foi tirada! Marque algum item como OK e adicione a foto primeiro.");
            return;
        }

        if (navigator.canShare && navigator.canShare({ files: filesArray })) {
            try {
                await navigator.share({
                    files: filesArray
                });
            } catch (err) {
                console.log("Compartilhamento cancelado", err);
            }
        } else {
            alert("Seu navegador não suporta envio de álbum de imagens direto.");
        }
    }
